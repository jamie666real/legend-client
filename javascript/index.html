<!DOCTYPE html>
<html lang="und" style="width:100%;height:100%;background-color:black;">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0">
		<meta name="description" content="Eaglercraft 1.12 test directory HTML page">
		<meta name="keywords" content="eaglercraft, eaglercraftx, minecraft, 1.12, 1.12.2">
		<title>Legend Client/Cosmix Client</title>
		<meta property="og:locale" content="en-US">
		<meta property="og:type" content="website">
		<meta property="og:title" content="Legend Client/Cosmix Client">
		<meta property="og:description" content="Play minecraft 1.12.2 in your browser!">
		<link type="image/png" rel="shortcut icon" href="favicon.jpeg">
		<script type="text/javascript" src="classes.js?v=legend-client-eagtek-jpeg-v4"></script>
		<script type="text/javascript">
			"use strict";
			window.addEventListener("load", function() {
				if(window.location.href.indexOf("file:") === 0) {
					alert("HTTP please, do not open this file locally, run a local HTTP server and load it via HTTP");
				}else {
					var relayId = Math.floor(Math.random() * 3);
					var initialSkinData = null;
					var initialSkinModel = "default";
					var initialSkinId = null;
					try {
						var skinSelection = window.localStorage.getItem("legendClientSkinSelection");
						var skinOverridePixels = window.localStorage.getItem("legendClientSkinOverridePixels");
						if(skinOverridePixels && skinSelection !== "profile" && skinSelection !== "uploaded"
								&& skinSelection !== null && /^[0-9]+$/.test(skinSelection)) {
							initialSkinData = skinOverridePixels;
							initialSkinModel = window.localStorage.getItem("legendClientSkinModel") || "default";
						}else if(skinSelection === "uploaded" || (!skinSelection && window.localStorage.getItem("legendClientSkinPixels"))) {
							initialSkinData = window.localStorage.getItem("legendClientSkinPixels");
							initialSkinModel = window.localStorage.getItem("legendClientSkinModel") || "default";
						}else if(skinSelection !== "profile" && skinSelection !== null && /^[0-9]+$/.test(skinSelection)) {
							initialSkinId = skinSelection;
						}
					}catch(e) {
						console.error("Could not read the launcher skin from browser storage", e);
					}
					window.eaglercraftXOpts = {
						demoMode: false,
						container: "game_frame",
						initialUsername: new URLSearchParams(window.location.search).get("username"),
						initialSkinData: initialSkinData,
						initialSkinModel: initialSkinModel,
						initialSkinId: initialSkinId,
						assetsURI: "assets.epk?v=legend-client-eagtek-jpeg-v4",
						localesURI: "lang/",
						worldsDB: "worlds",
						servers: [
							{ name: "§d§lSHADOW §f§lNETWORK", addr: "play.shadownetwork.shop" },
							{ name: "§e§lCosmi§6§lxMC", addr: "mc.cosmixmc.org" },
							{ name: "§b§lNex§9§lon§5§lMC", addr: "nexonmc.pathost.xyz" }
						],
						logInvalidCerts: true,
						crashOnUncaughtExceptions: true
					};
					main();
				}
			});
		</script>
	</head>
	<body style="margin:0px;width:100%;height:100%;overflow:hidden;background-color:black;" id="game_frame">
	</body>
